name: Test micro.fair

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies for HTTP smoke tests
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Execute regression tests
        run: npm test
